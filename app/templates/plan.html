{% extends "base.html" %}

{% block content %}

<div class="study-panel">

    <!-- FORM -->
    <div class="form-wrapper">
        <form method="post" action="/plan/add">
            <input name="title" placeholder="Tiêu đề" required>
            <input name="script" placeholder="Mô tả">

            <select name="priority">
                <option value="low">Low</option>
                <option value="normal">Normal</option>
                <option value="high">High</option>
            </select>

            <input type="date" name="deadline">

            <button type="submit">+ Thêm</button>
        </form>
    </div>

    <!-- LIST -->
    <div class="list-wrapper" style="display:block">

        {% for p in plans %}
        <div class="plan-row {% if p.done %}done{% endif %}">

            <input type="checkbox"
                   {% if p.done %}checked{% endif %}
                   onchange="toggleDone({{ p.id }}, this.checked)">

            <div class="plan-text">
                <b>{{ p.title }}</b>
                {% if p.script %}<span>{{ p.script }}</span>{% endif %}
            </div>

            <div class="plan-meta">
                <span class="priority {{ p.priority }}">{{ p.priority }}</span>
                {% if p.deadline %}
                <span class="deadline">📅 {{ p.deadline }}</span>
                {% endif %}
            </div>

            <div class="actions">
                <a href="/plan/delete/{{ p.id }}" title="Xoá">🗑</a>
            </div>

        </div>
        {% endfor %}

    </div>

</div>

<script>
function toggleDone(id, checked) {
    var row = event.target.closest(".plan-row");
    if (row) row.classList.toggle("done", checked);
    fetch(`/plan/toggle/${id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ done: checked ? 1 : 0 })
    });
}
</script>

{% endblock %}
