{% extends "base.html" %}

{% block content %}

<div class="study-panel">

    <!-- FORM -->
    <div class="form-wrapper">
        <form method="post" action="/plan/add">
            <input name="title" placeholder="Tiêu đề" required>
            <input name="script" placeholder="Mô tả">

            <select name="priority">
                <option value="low">Low</option>
                <option value="normal">Normal</option>
                <option value="high">High</option>
            </select>

            <input type="date" name="deadline">

            <button type="submit">+ Thêm</button>
        </form>
    </div>

    <!-- LIST -->
    <div class="list-wrapper" style="display:block">

        {% for p in plans %}
        <div class="plan-row {% if p.done %}done{% endif %}">

            <input type="checkbox"
                   {% if p.done %}checked{% endif %}
                   onchange="toggleDone(this, {{ p.id }})">

            <div class="plan-text">
                <b>{{ p.title }}</b>
                {% if p.script %}<span>{{ p.script }}</span>{% endif %}
            </div>

            <div class="plan-meta">
                <span class="priority {{ p.priority }}">{{ p.priority }}</span>
                {% if p.deadline %}
                <span class="deadline">📅 {{ p.deadline }}</span>
                {% endif %}
            </div>

            <div class="actions">
                <a href="/plan/edit/{{ p.id }}" title="Sửa">✏️</a>
                <form method="post" action="/plan/delete/{{ p.id }}" onsubmit="return confirm('Xoá kế hoạch này?')">
                    <button type="submit" title="Xoá">🗑</button>
                </form>
            </div>

        </div>
        {% endfor %}

    </div>

</div>

<script>
function toggleDone(box, id) {
    // Nhan thang o input thay vi doc window.event — Firefox khong co bien do.
    var checked = box.checked;
    var row = box.closest(".plan-row");
    if (row) row.classList.toggle("done", checked);

    fetch(`/plan/toggle/${id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ done: checked ? 1 : 0 })
    }).then(function (res) {
        if (!res.ok) throw new Error(res.status);
    }).catch(function () {
        box.checked = !checked;                              // tra o tick ve cu
        if (row) row.classList.toggle("done", !checked);
        alert("Chua luu duoc, thu lai nha 🥲");
    });
}
</script>

{% endblock %}
