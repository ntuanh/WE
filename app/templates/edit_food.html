{% extends "base.html" %}

{% block content %}

<div class="study-panel">

    <h2>✏️ Chỉnh sửa quán ăn</h2>

    <form method="post" action="/food/edit/{{ item.id }}">
        <input name="name" value="{{ item.name }}" placeholder="Tên quán" required>
        <input name="address" value="{{ item.address }}" placeholder="Địa chỉ" required>
        <input name="note" value="{{ item.note }}" placeholder="Ghi chú">
        <input name="image" value="{{ item.image or '' }}" placeholder="Link ảnh (URL)">

        <select name="rating" title="Đánh giá">
            {% for r in range(6) %}
            <option value="{{ r }}" {% if (item.rating or 0)|int == r %}selected{% endif %}>
                {% if r == 0 %}☆ Chưa chấm{% else %}{{ '★' * r }} {{ r }}{% endif %}
            </option>
            {% endfor %}
        </select>

        <select name="status">
            <option value="da_an" {% if item.status == "da_an" %}selected{% endif %}>Đã ăn</option>
            <option value="chua_an" {% if item.status == "chua_an" %}selected{% endif %}>Chưa ăn</option>
            <option value="muon_an" {% if item.status == "muon_an" %}selected{% endif %}>Muốn ăn</option>
        </select>

        <button type="submit">💾 Lưu</button>
    </form>

</div>

{% endblock %}
